[project]
name = "macropad"
version = "0.1.0"
description = "macOS CLI to program the 6-key + 1-knob 'CH57x' USB macropad (USB 1189:8890), built to be driven by AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "libusb-package>=1.0",
    "pyusb>=1.2",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/nacif-software/vibe-coder-keyboard"

[project.scripts]
macropad = "macropad.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macropad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
